# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    environment:
      FLASK_ENV: production
      LOG_JSON: "true"
      PREFERRED_URL_SCHEME: https

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?required}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/conf.d:/etc/nginx/templates:ro
      - static:/srv/static:ro
      - uploads:/srv/uploads:ro
      - certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew twice daily; certbot only acts when a cert is near expiry.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-itsc}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - uploads:/srv/uploads:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  static:
  certs:
  certbot-webroot:
  backups:
