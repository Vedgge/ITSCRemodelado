[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itsc"
version = "1.0.0"
description = "Instituto Tecnico Superior Cordoba - sitio institucional (proyecto de portafolio)"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsc = ["templates/**/*", "static/**/*"]

# ----------------------------------------------------------------------------
# Ruff: linting + formatting. `S` is the bandit ruleset; S608 is the rule that
# would have caught the f-string SQL injection in the original main.py.
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "S",         # flake8-bandit  <- S608 hardcoded-sql-expression
    "SIM",       # flake8-simplify
    "ARG",       # flake8-unused-arguments
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
    "DTZ",       # flake8-datetimez (naive datetime.now() was a bug in main.py)
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default arg - normal in Flask/SQLAlchemy
    "RUF012",  # mutable class attrs need ClassVar - noisy with SQLAlchemy
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "S105", "S106",   # asserts and fake credentials are the point
    "ARG001", "ARG002", "ARG005",  # stub callbacks legitimately ignore args
    "DTZ011",  # date.today() is correct for calendar dates in fixtures
    "SIM105", "S110",  # terse exception handling is fine in tests
]
"src/itsc/config.py" = ["S105"]
"migrations/**/*.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["itsc"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------
# mypy: strict on the security-critical modules, lenient elsewhere.
# Ratchet up over time, never down.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = []

# Strict where the value is: business logic, security, configuration.
# Spelled out rather than `strict = true`, which mypy applies globally even
# inside a per-module section -- it was forcing annotations on every Flask
# view in the project.
[[tool.mypy.overrides]]
module = ["itsc.services.*", "itsc.security", "itsc.config", "itsc.navigation"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

# Models are declarative schema definitions. Flask-SQLAlchemy builds db.Model
# dynamically, so mypy cannot resolve it and reports every model class as
# "Name db.Model is not defined" -- a known limitation with no upstream plugin.
# The real guarantees here are the database CHECK constraints and the
# constraint tests, not the type checker.
[[tool.mypy.overrides]]
module = ["itsc.models.*"]
disallow_subclassing_any = false
disable_error_code = ["name-defined", "misc"]

# Third-party packages that ship no py.typed marker. Listing them explicitly
# (rather than a global ignore_missing_imports) keeps new untyped dependencies
# visible instead of silently absorbed.
[[tool.mypy.overrides]]
module = [
    "flask_wtf.*", "flask_limiter.*", "flask_talisman.*", "flask_session.*",
    "flask_login.*", "flask_migrate.*", "wtforms.*", "cachelib.*",
]
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

# Blueprints and forms are framework-coupled: view functions are wrapped by
# untyped decorators and return Flask's loosely-typed response union, so strict
# mode there produces noise rather than safety. The value is concentrated in
# models, services, security and config, which stay strict above.
[[tool.mypy.overrides]]
module = ["itsc.blueprints.*", "itsc.forms.*"]
disallow_untyped_defs = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

# ----------------------------------------------------------------------------
# pytest + coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "security: security regression tests, each named for the defect it guards",
    "slow: tests that hit the network or build images",
]
# Warnings from our own code are errors. Third-party deprecations are
# listed explicitly rather than blanket-ignored, so each one is a visible,
# reviewable decision instead of silent drift.
filterwarnings = [
    "error",
    # Flask-Session 0.8 deprecations; the Redis backend used in production is
    # unaffected. Revisit when Flask-Session 1.0 lands.
    "ignore:.*use_signer.*:DeprecationWarning",
    "ignore:.*SESSION_FILE_DIR.*:DeprecationWarning",
    "ignore:.*FileSystemSessionInterface.*:DeprecationWarning",
    # SQLAlchemy/psycopg emit these during teardown of the test transaction.
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/itsc"]
branch = true
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------------
# djlint: Jinja template linting
# ----------------------------------------------------------------------------
[tool.djlint]
profile = "jinja"
extension = "html"
# H016/H030: <title> and the meta description live in partials/head.html, which
#   djlint cannot follow through {% include %}, so it reports every page as
#   missing them. Coverage is asserted in tests/integration instead.
# T028: flags {% if %} wrapping whole <meta>/<link> elements as if it were
#   inside an attribute value. It is not.
ignore = "H016,H030,T028"
indent = 2
max_line_length = 120
