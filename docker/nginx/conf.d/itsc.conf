upstream itsc_app {
    server web:8000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge passes through; everything else is redirected.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # --- Static assets ----------------------------------------------------
    # Safe to cache for a year because every URL carries a content hash
    # (?v=<blake2b>), so changed bytes mean a changed URL.
    location /static/ {
        alias /srv/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri @app;
    }

    # --- Uploaded media ---------------------------------------------------
    # Defence in depth on top of the server-side re-encode: even if something
    # non-image were ever stored here, sandbox + nosniff stop it executing.
    location /media/ {
        alias /srv/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @app;
    }

    # --- Health -----------------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://itsc_app;
    }

    # --- Login: tighter rate limit than the rest of the site --------------
    location = /ingresar {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://itsc_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://itsc_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    location @app {
        proxy_pass http://itsc_app;
        include /etc/nginx/snippets/proxy.conf;
    }
}
