# NOTE: Content-Security-Policy is deliberately absent here.
#
# Talisman sets CSP on application responses. Two CSP headers do not "merge" --
# the browser enforces their INTERSECTION, which produces breakage that looks
# like a caching bug and is miserable to diagnose. One owner only.
#
# `always` so these apply to error responses too, not just 2xx.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
