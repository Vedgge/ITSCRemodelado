user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_id is echoed into the app's structured logs, so an access-log
    # line and every application log line for the same request share an id.
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"ms":$request_time,"rid":"$request_id"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;          # do not advertise the nginx version

    # MUST exceed the app's MAX_CONTENT_LENGTH (5 MB). If nginx rejects first,
    # it returns its own bare 413 and the friendly error page never renders.
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml image/svg+xml application/xml;

    # Cheap protection against a single IP flooding the app.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
